# Production on the Google Cloud VM: `docker compose up -d --build` in deploy/.
# Secrets live in deploy/.env (see .env.example), never in Git.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marthe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: marthe
    # Not published: only the app reaches the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marthe -d marthe"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://marthe:${POSTGRES_PASSWORD}@db:5432/marthe
      CANONICAL_DOMAIN: chezmarthe.org
      OLD_DOMAINS: chezmarthe.site
    depends_on:
      db:
        condition: service_healthy

  # Cloudflare Tunnel: no open port on the VM, HTTPS and *.chezmarthe.org handled by Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - app

volumes:
  pgdata:
