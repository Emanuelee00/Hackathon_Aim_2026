# Production on the Google Cloud VM: `docker compose up -d --build` in deploy/.
# Secrets live in deploy/.env (see .env.example), never in Git.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marthe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: marthe
    # Not published: only the app reaches the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marthe -d marthe"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://marthe:${POSTGRES_PASSWORD}@db:5432/marthe
      CANONICAL_DOMAIN: ${CANONICAL_DOMAIN:-}
      OLD_DOMAINS: ${OLD_DOMAINS:-}
      # E-mails (funding reminders and the forms' confirmations): nothing is sent until one of the two services is set (see .env.example).
      REMINDER_TO: ${REMINDER_TO:-contact@chezmarthe.org}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@chezmarthe.org}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  # The only service reachable from the Internet: HTTPS in front of the app.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOSTS: ${SITE_HOSTS:?set SITE_HOSTS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: kept across restarts so Let's Encrypt is not asked again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
