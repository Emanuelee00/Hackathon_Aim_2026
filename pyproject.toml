[project]
name = "marthe"
version = "0.1.0"
description = "Prototipo Chez Marthe per Hackathon AIM 2026"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.117,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12,<1",
]

[tool.vercel]
entrypoint = "main:app"
