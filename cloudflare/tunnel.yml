# Cloudflare Tunnel: chezmarthe.site and every subdomain go to the app on this laptop.
# Credentials are read from ~/.cloudflared (created by `cloudflared tunnel create marthe`).
tunnel: marthe
ingress:
  - hostname: chezmarthe.site
    service: http://localhost:8000
  - hostname: "*.chezmarthe.site"
    service: http://localhost:8000
  - service: http_status:404
